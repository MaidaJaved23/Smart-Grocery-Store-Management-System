<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480" role="img" aria-label="Smart Grocery Store Management System banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="55%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#65a30d"/>
      <animate attributeName="x2" values="1;0.6;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <clipPath id="round"><rect width="1600" height="480" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1600" height="480" fill="url(#bg)"/>

    <!-- floating bubbles -->
    <g fill="#ffffff" opacity="0.12">
      <circle cx="140" cy="380" r="70"><animate attributeName="cy" values="380;330;380" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="90" r="45"><animate attributeName="cy" values="90;140;90" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="1180" cy="400" r="90"><animate attributeName="cy" values="400;350;400" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="1480" cy="110" r="60"><animate attributeName="cy" values="110;160;110" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="70" r="30"><animate attributeName="cy" values="70;110;70" dur="4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- shopping cart icon -->
    <g transform="translate(150 150)" filter="url(#soft)">
      <path d="M0 0 H50 L90 150 H250 L285 40 H62" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="120" cy="205" r="22" fill="#fff"/>
      <circle cx="225" cy="205" r="22" fill="#fff"/>
      <rect x="110" y="62" width="34" height="62" rx="8" fill="#fde68a"/>
      <rect x="156" y="52" width="34" height="72" rx="8" fill="#fca5a5"/>
      <rect x="202" y="68" width="34" height="56" rx="8" fill="#bbf7d0"/>
      <animateTransform attributeName="transform" type="translate" values="150 150;150 140;150 150" dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- title -->
    <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#fff">
      <text x="520" y="215" font-size="84" font-weight="800" letter-spacing="2" opacity="0">
        SMART GROCERY
        <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
      </text>
      <text x="520" y="305" font-size="84" font-weight="800" letter-spacing="2" fill="#fef08a" opacity="0">
        STORE SYSTEM
        <animate attributeName="opacity" values="0;1" begin="0.5s" dur="1.2s" fill="freeze"/>
      </text>
      <text x="522" y="365" font-size="30" font-weight="500" opacity="0">
        Products  •  Stock  •  Sales  •  Reports   —   built with Python lists &amp; dictionaries
        <animate attributeName="opacity" values="0;0.95" begin="1s" dur="1.2s" fill="freeze"/>
      </text>
    </g>

    <!-- animated underline -->
    <rect x="522" y="392" height="8" rx="4" fill="#fff" opacity="0.85">
      <animate attributeName="width" values="0;640" dur="1.6s" begin="0.8s" fill="freeze"/>
    </rect>

    <!-- shine sweep -->
    <rect x="-400" y="0" width="400" height="480" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-500;1900" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
