<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-label="Entity relationship diagram">
  <defs>
    <marker id="crow" viewBox="0 0 20 20" refX="2" refY="10" markerWidth="20" markerHeight="20" orient="auto-start-reverse">
      <path d="M18 2 L2 10 L18 18 M2 10 H18" fill="none" stroke="#334155" stroke-width="2"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .flow { stroke-dasharray: 10 8; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -36; } }
    </style>
  </defs>
  <rect width="1400" height="760" rx="24" fill="#f8fafc"/>
  <text x="700" y="58" text-anchor="middle" font-size="34" font-weight="800" fill="#0f172a">Entity-Relationship Diagram</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#475569">Smart Grocery Store System — data model</text>

  <!-- Store (top of hierarchy) -->
  <g filter="url(#sh)">
    <rect x="520" y="120" width="360" height="86" rx="16" fill="#0f766e"/>
    <text x="700" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">GROCERY STORE</text>
    <text x="700" y="188" text-anchor="middle" font-size="17" fill="#ccfbf1">the running Python program</text>
  </g>
  <path d="M600 206 V270 H330 V300" fill="none" stroke="#0f766e" stroke-width="3" class="flow"/>
  <path d="M800 206 V270 H1070 V300" fill="none" stroke="#0f766e" stroke-width="3" class="flow"/>
  <text x="440" y="262" font-size="17" fill="#0f766e" font-weight="600">list: products</text>
  <text x="900" y="262" font-size="17" fill="#0f766e" font-weight="600">list: sales</text>

  <!-- PRODUCT entity -->
  <g filter="url(#sh)">
    <rect x="80" y="300" width="500" height="380" rx="16" fill="#fff" stroke="#15803d" stroke-width="3"/>
    <path d="M80 316 a16 16 0 0 1 16 -16 H564 a16 16 0 0 1 16 16 V366 H80 Z" fill="#15803d"/>
    <text x="330" y="344" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">PRODUCT</text>
    <g font-size="22" fill="#0f172a">
      <text x="110" y="414" font-weight="700">id</text><text x="250" y="414" fill="#475569">int</text><text x="400" y="414" fill="#b45309" font-weight="700">PK · unique</text>
      <text x="110" y="470" font-weight="700">name</text><text x="250" y="470" fill="#475569">str</text><text x="400" y="470" fill="#475569">not empty</text>
      <text x="110" y="526" font-weight="700">category</text><text x="250" y="526" fill="#475569">str</text><text x="400" y="526" fill="#475569">not empty</text>
      <text x="110" y="582" font-weight="700">price</text><text x="250" y="582" fill="#475569">float</text><text x="400" y="582" fill="#475569">&gt; 0</text>
      <text x="110" y="638" font-weight="700">stock</text><text x="250" y="638" fill="#475569">int</text><text x="400" y="638" fill="#475569">&gt;= 0</text>
    </g>
    <g stroke="#e2e8f0" stroke-width="2"><path d="M100 436 H560 M100 492 H560 M100 548 H560 M100 604 H560"/></g>
  </g>

  <!-- SALE entity -->
  <g filter="url(#sh)">
    <rect x="820" y="300" width="500" height="380" rx="16" fill="#fff" stroke="#1d4ed8" stroke-width="3"/>
    <path d="M820 316 a16 16 0 0 1 16 -16 H1304 a16 16 0 0 1 16 16 V366 H820 Z" fill="#1d4ed8"/>
    <text x="1070" y="344" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">SALE</text>
    <g font-size="22" fill="#0f172a">
      <text x="850" y="414" font-weight="700">product_id</text><text x="1050" y="414" fill="#475569">int</text><text x="1150" y="414" fill="#b45309" font-weight="700">FK → id</text>
      <text x="850" y="470" font-weight="700">product_name</text><text x="1050" y="470" fill="#475569">str</text>
      <text x="850" y="526" font-weight="700">quantity_sold</text><text x="1050" y="526" fill="#475569">int</text><text x="1150" y="526" fill="#475569">&gt;= 1</text>
      <text x="850" y="582" font-weight="700">total_amount</text><text x="1050" y="582" fill="#475569">float</text><text x="1150" y="582" fill="#475569">price × qty</text>
    </g>
    <g stroke="#e2e8f0" stroke-width="2"><path d="M840 436 H1300 M840 492 H1300 M840 548 H1300"/></g>
  </g>

  <!-- Relationship -->
  <path d="M580 490 H820 M788 490 L820 468 M788 490 L820 512" stroke="#334155" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M598 478 V502" stroke="#334155" stroke-width="3.5"/>
  <path d="M606 478 V502" stroke="#334155" stroke-width="3.5"/>
  <rect x="610" y="440" width="196" height="38" rx="19" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="708" y="466" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">is sold in</text>
  <text x="708" y="530" text-anchor="middle" font-size="18" fill="#334155">1 : N</text>
  <text x="708" y="556" text-anchor="middle" font-size="15" fill="#64748b">one product, many sales</text>

  <text x="700" y="730" text-anchor="middle" font-size="16" fill="#64748b">PK = primary key · FK = foreign key (the ID copied into each sale record)</text>
</svg>
